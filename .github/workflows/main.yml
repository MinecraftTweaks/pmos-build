name: Build chagallwifi
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip openssl android-tools-mkbootimg
          pip install --user --break-system-packages pmbootstrap
      - name: Build recovery zip
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap config channel edge
          pmbootstrap config device samsung-chagallwifi
          pmbootstrap config ui none
          pmbootstrap config user user
          pmbootstrap -y install --android-recovery-zip --password 1234
          pmbootstrap export
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pmos-chagallwifi-rom
          path: /tmp/postmarketOS-export/pmos-samsung-chagallwifi.zip
          
