name: Build chagallwifi
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 openssl android-tools-mkbootimg
          git clone --depth=1 https://postmarketos.org
      - name: Build recovery zip
        run: |
          cd pmbootstrap
          ./pmbootstrap.py config channel edge
          ./pmbootstrap.py config device samsung-chagallwifi
          ./pmbootstrap.py config ui none
          ./pmbootstrap.py config user user
          ./pmbootstrap.py -y install --android-recovery-zip --password 1234
          ./pmbootstrap.py export
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pmos-chagallwifi-rom
          path: /tmp/postmarketOS-export/pmos-samsung-chagallwifi.zip
          
